[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-revenue-analyzer"
version = "0.1.0"
description = "Python SDK for Airbnb Revenue, Occupancy & ROI Analyzer on Apify. Analyze Airbnb listings or discover market comparables, then estimate weekly, monthly and annual revenue, occupancy, ADR, RevPAR, NOI, cap rate, cash-on-cash ROI and opportunity ranking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["airbnb", "airbnb-analytics", "occupancy", "revenue-estimation", "roi", "short-term-rental", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/airbnb-revenue-analyzer-python"
Documentation = "https://github.com/apivault-labs/airbnb-revenue-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/airbnb-revenue-occupancy-roi-analyzer"
"Bug Tracker" = "https://github.com/apivault-labs/airbnb-revenue-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["airbnb_revenue_analyzer*"]
